<!doctype html>
<html><head><meta charset="utf-8"><title>WSN Attack Detection</title>
<style>
body{font-family:Arial,sans-serif;max-width:480px;margin:30px auto;padding:0 12px}
input{width:100%;padding:8px;margin:4px 0 12px;box-sizing:border-box}
button{padding:10px 18px}
.result{margin-top:20px;padding:14px;background:#eef;border-radius:6px;font-weight:bold}
</style></head><body>
<h2>Cyber Attack Detection in Wireless Sensor Networks</h2>
<p>Model in use: {{ model_name }}</p>
<form method="post">
{% for f in features %}
  <label>{{ f }}</label>
  <input name="{{ f }}" value="{{ values.get(f, '') }}" required>
{% endfor %}
  <button type="submit">Detect</button>
</form>
{% if result %}<div class="result">Result: {{ result }}</div>{% endif %}
</body></html>
